id = "basic_plus"
name = "Basic Plus"
version = "0.1.0"
schema_version = 1
authors = ["clev3r-mojo contributors"]
description = "Basic Plus language support (.bp/.bpi/.bpm): highlighting, brackets, auto-indent, outline, LSP."
repository = "https://github.com/Gleb-fd/clev3r-mojo"

# Tree-sitter grammar. `rev` must be a commit that contains grammar/grammar.js
# + grammar/src/parser.c, otherwise Zed checks out stale parser sources.
# Update it after committing grammar changes.
[grammars.basic_plus]
repository = "https://github.com/Gleb-fd/clev3r-mojo"
rev = "76081a635ac2fa0dbb6d0727c043a996a599603d"
path = "grammar"

# Language server: the extension runs `bp lsp` from the compiler built by
# install.sh. lib.rs looks for it at a dev path; see src/lib.rs.
[language_servers.basic-plus]
name = "Basic Plus LSP"
languages = ["Basic Plus"]
